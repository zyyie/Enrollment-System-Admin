<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Enrollment Management System</title>
  <link rel="stylesheet" href="admin/css/login.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.5;
      color: #1a1a2e;
    }

    /* Inline fallback — same background as student portal */
    .login-page {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
      background: linear-gradient(160deg, #1a3a6b 0%, #0f2447 55%, #162d52 100%);
    }
    .login-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }
    .login-bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(26, 58, 107, 0.5), rgba(15, 36, 71, 0.6));
      z-index: 1;
      pointer-events: none;
    }

    .admin-login-card {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      width: min(440px, 100%);
      max-width: 440px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 0 0 auto;
      background: #fff;
      border-radius: 0;
      padding: 48px 40px;
      box-shadow: -4px 0 32px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
    }
    .admin-login-card img { width: 72px; display: block; margin: 0 auto 16px; }
    .admin-login-card h1 { text-align: center; font-size: 22px; margin: 0 0 8px; }
    .admin-login-card p { text-align: center; color: #64748b; margin: 0 0 24px; font-size: 14px; }
    .admin-login-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .admin-login-card input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 14px; box-sizing: border-box; }
    .password-field { position: relative; display: block; margin-bottom: 14px; }
    .password-field input { margin-bottom: 0; padding-right: 42px; }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
    }
    .password-toggle svg { display: block; width: 18px; height: 18px; }
    .password-toggle:hover,
    .password-toggle:focus-visible { color: #1a3a6b; background: rgba(26, 58, 107, 0.06); outline: none; }
    .password-toggle.is-visible { color: #1a3a6b; }
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .admin-login-card button[type="submit"] { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font-weight: 600; cursor: pointer; }
    .admin-login-card .error { color: #dc2626; font-size: 13px; min-height: 18px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="admin-login-card">
      <h1>Enrollment Management System</h1>
      <p>Admin sign in</p>
      <div class="error" id="loginError"></div>
      <form id="adminLoginForm">
        <label for="facultyId">Registrar ID</label>
        <input type="text" id="facultyId" placeholder="FAC-2026-0001" required>
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <button type="submit">Sign in</button>
      </form>
      <p style="font-size:12px;color:#64748b;margin-top:16px;text-align:center;">Teachers: use the <a href="http://localhost:8003/login.html">Faculty Portal</a>.</p>
    </div>
  </div>

  <script src="/js/password-field.js"></script>
  <script>
    const LOGIN_LOCK_KEY = 'shsAdminLoginLock';
    const LOGIN_LOCK_SECONDS = 30;
    const LOGIN_MAX_FAILS = 3;
    let _loginLockTimer = null;

    function readLoginLockState() {
      try {
        return JSON.parse(localStorage.getItem(LOGIN_LOCK_KEY) || 'null') || { fails: 0, lockUntil: 0 };
      } catch (err) {
        return { fails: 0, lockUntil: 0 };
      }
    }

    function writeLoginLockState(state) {
      localStorage.setItem(LOGIN_LOCK_KEY, JSON.stringify(state));
    }

    function getLoginLockRemainingSec(state) {
      const until = Number(state && state.lockUntil || 0);
      if (!until) return 0;
      return Math.max(0, Math.ceil((until - Date.now()) / 1000));
    }

    function setLoginFormDisabled(disabled) {
      document.querySelectorAll('#adminLoginForm input, #adminLoginForm button[type="submit"]').forEach((el) => {
        el.disabled = !!disabled;
      });
    }

    function refreshLoginLockoutUI() {
      const errorEl = document.getElementById('loginError');
      const state = readLoginLockState();
      const remaining = getLoginLockRemainingSec(state);
      if (remaining <= 0) {
        if (state.lockUntil) writeLoginLockState({ fails: 0, lockUntil: 0 });
        setLoginFormDisabled(false);
        if (_loginLockTimer) {
          clearInterval(_loginLockTimer);
          _loginLockTimer = null;
        }
        return 0;
      }
      setLoginFormDisabled(true);
      if (errorEl) errorEl.textContent = `Too many failed attempts. Try again in ${remaining}s.`;
      if (!_loginLockTimer) {
        _loginLockTimer = setInterval(() => {
          const left = refreshLoginLockoutUI();
          if (left <= 0 && errorEl && /Too many failed attempts/.test(errorEl.textContent || '')) {
            errorEl.textContent = '';
          }
        }, 1000);
      }
      return remaining;
    }

    function recordLoginFailure(serverLockUntil) {
      if (serverLockUntil) {
        writeLoginLockState({ fails: LOGIN_MAX_FAILS, lockUntil: Number(serverLockUntil) });
        refreshLoginLockoutUI();
        return;
      }
      const state = readLoginLockState();
      const fails = Number(state.fails || 0) + 1;
      if (fails >= LOGIN_MAX_FAILS) {
        writeLoginLockState({ fails, lockUntil: Date.now() + LOGIN_LOCK_SECONDS * 1000 });
      } else {
        writeLoginLockState({ fails, lockUntil: 0 });
      }
      refreshLoginLockoutUI();
    }

    const idleParams = new URLSearchParams(window.location.search);
    if (idleParams.get('idle') === '1') {
      const errorEl = document.getElementById('loginError');
      if (errorEl) errorEl.textContent = 'You were signed out after 15 minutes of inactivity. Please log in again.';
      window.history.replaceState({}, '', 'login.html');
    }
    refreshLoginLockoutUI();

    document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const facultyId = document.getElementById('facultyId').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      const remaining = refreshLoginLockoutUI();
      if (remaining > 0) {
        errorEl.textContent = `Too many failed attempts. Try again in ${remaining}s.`;
        return;
      }
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/auth/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminId: facultyId, password })
        });
        const contentType = (res.headers.get('content-type') || '').toLowerCase();
        if (!contentType.includes('application/json')) {
          errorEl.textContent =
            'Admin API not reachable. Run python server.py in this folder, then open http://localhost:8001/login.html (do not use Live Server or file://).';
          return;
        }
        const data = await res.json();
        if (!res.ok || !data.success) {
          if (data.code === 'LOGIN_LOCKED' && data.lockUntil) {
            writeLoginLockState({ fails: LOGIN_MAX_FAILS, lockUntil: Number(data.lockUntil) });
            refreshLoginLockoutUI();
          } else if (res.status === 401 || res.status === 429) {
            recordLoginFailure(data.lockUntil);
          }
          const state = readLoginLockState();
          const left = getLoginLockRemainingSec(state);
          if (left > 0) {
            errorEl.textContent = `Too many failed attempts. Try again in ${left}s.`;
          } else {
            const fails = Number(state.fails || data.failedAttempts || 0);
            errorEl.textContent = (data.error || 'Invalid credentials')
              + (fails > 0 ? ` (${fails}/${LOGIN_MAX_FAILS} failed attempts)` : '');
          }
          return;
        }
        localStorage.removeItem(LOGIN_LOCK_KEY);
        const user = data.admin || data.faculty || data.user || data;
        sessionStorage.setItem('shsFaculty', JSON.stringify(user));
        sessionStorage.setItem('loginRole', 'faculty');
        window.location.href = user && user.mustChangePassword
          ? 'admin/account.html'
          : 'admin/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed';
      }
    });
  </script>
</body>
</html>
