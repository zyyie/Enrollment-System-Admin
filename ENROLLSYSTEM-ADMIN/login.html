<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Geranova EMS</title>
  <link rel="stylesheet" href="admin/css/login.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }

    /* Inline fallback — same background as student portal */
    .login-page {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .login-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }
    .login-bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(26, 58, 107, 0.5), rgba(15, 36, 71, 0.6));
      z-index: 1;
      pointer-events: none;
    }

    .admin-login-card {
      position: relative;
      z-index: 2;
      width: min(420px, 92vw);
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    }
    .admin-login-card img { width: 72px; display: block; margin: 0 auto 16px; }
    .admin-login-card h1 { text-align: center; font-size: 22px; margin: 0 0 8px; }
    .admin-login-card p { text-align: center; color: #64748b; margin: 0 0 24px; font-size: 14px; }
    .admin-login-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .admin-login-card input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 14px; box-sizing: border-box; }
    .password-field { position: relative; display: block; margin-bottom: 14px; }
    .password-field input { margin-bottom: 0; padding-right: 42px; }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
    }
    .password-toggle svg { display: block; width: 18px; height: 18px; }
    .password-toggle:hover,
    .password-toggle:focus-visible { color: #1a3a6b; background: rgba(26, 58, 107, 0.06); outline: none; }
    .password-toggle.is-visible { color: #1a3a6b; }
    .admin-login-card button[type="submit"] { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font-weight: 600; cursor: pointer; }
    .admin-login-card .error { color: #dc2626; font-size: 13px; min-height: 18px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="login-page">
    <img src="images/hero-bg.jpg" alt="" class="login-bg">
    <div class="login-bg-overlay" aria-hidden="true"></div>
    <div class="admin-login-card">
      <img src="assets/geranova-logo.png" alt="Geranova Logo">
      <h1>Admin Portal</h1>
      <p>Registrar sign in only</p>
      <div class="error" id="loginError"></div>
      <form id="adminLoginForm">
        <label for="facultyId">Registrar ID</label>
        <input type="text" id="facultyId" placeholder="FAC-2026-0001" required>
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <button type="submit">Sign in</button>
      </form>
      <p style="font-size:12px;color:#64748b;margin-top:16px;text-align:center;">Teachers: use the <a href="http://localhost:8003/login.html">Faculty Portal</a>.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/password-field.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/supabase-service.js"></script>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const facultyId = document.getElementById('facultyId').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/auth/faculty', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ facultyId, password })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          errorEl.textContent = data.error || 'Invalid credentials';
          return;
        }
        sessionStorage.setItem('shsFaculty', JSON.stringify(data.faculty || data.user || data));
        sessionStorage.setItem('loginRole', 'faculty');
        window.location.href = 'admin/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed';
      }
    });
  </script>
</body>
</html>
