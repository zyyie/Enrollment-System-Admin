<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Admin Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body class="admin-layout">
  <div id="adminSidebarWrap"></div>
  <div class="admin-main">
    <div id="adminHeader"></div>
    <main class="admin-content" id="pageContent"></main>
  </div>

  <script src="../js/password-field.js"></script>
  <script src="../js/icons.js"></script>
  <script src="js/admin.js?v=2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!AdminApp.requireAuth()) return;
      AdminApp.initLayout('account', 'Account');
      AdminApp.mountAccountPage(document.getElementById('pageContent'));
    });
  </script>
</body>
</html>
