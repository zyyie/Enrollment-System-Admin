<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Application - Admin Portal</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-layout">
  <div id="adminSidebarWrap"></div>
  <div class="admin-main">
    <div id="adminHeader"></div>
    <main class="admin-content" id="pageContent">
      <div class="admin-empty">Loading...</div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        window.location.href = 'enrollment-request.html';
        return;
      }
      AdminApp.mountApplicationReview(document.getElementById('pageContent'), id);
    });
  </script>
</body>
</html>
