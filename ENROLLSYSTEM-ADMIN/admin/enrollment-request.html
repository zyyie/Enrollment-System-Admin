<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Applications - Geranova Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-layout">
  <div id="adminSidebarWrap"></div>
  <div class="admin-main">
    <div id="adminHeader"></div>
    <main class="admin-content">
      <div class="admin-card">
        <div class="admin-card-head"><i class="fas fa-clipboard-check"></i> Pending Admission Applications</div>
        <div class="admin-card-body" id="admissionsTable">
          <div class="admin-empty">Loading...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/admin.js"></script>
  <script>
    async function renderTable() {
      const list = await AdminApp.loadPendingAdmissions();
      await AdminApp.refreshLayout('enrollment-request', 'Review Applications');

      if (!list.length) {
        document.getElementById('admissionsTable').innerHTML =
          '<div class="admin-empty"><i class="fas fa-inbox"></i><br>No pending applications. New enrollments will appear here for review.</div>';
        return;
      }

      document.getElementById('admissionsTable').innerHTML = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>Applicant</th>
              <th>Application No.</th>
              <th>Email</th>
              <th>Strand</th>
              <th>Grade</th>
              <th>Payment</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(a => `
              <tr>
                <td><div class="student-name">${a.student}</div></td>
                <td>${a.applicationNumber || a.id}</td>
                <td>${a.email || '—'}</td>
                <td>${a.strand || '—'}</td>
                <td>${a.grade || '—'}</td>
                <td>${a.paymentMode === 'gcash' ? 'GCash · ' + (a.gcashReference || '—') : 'Cashier'}</td>
                <td>${a.date || '—'}</td>
                <td>
                  <a href="application-review.html?id=${encodeURIComponent(a.id)}" class="admin-btn primary" style="text-decoration:none;display:inline-block;">
                    <i class="fas fa-eye"></i> Review
                  </a>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
    }

    document.addEventListener('DOMContentLoaded', renderTable);
  </script>
</body>
</html>
