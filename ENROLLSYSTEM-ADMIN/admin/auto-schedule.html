<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Schedule - Admin Portal</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-layout">
  <div id="adminSidebarWrap"></div>
  <div class="admin-main">
    <div id="adminHeader"></div>
    <main class="admin-content" id="pageContent"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/auto-schedule.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AdminApp.initLayout('auto-schedule', 'Auto-Scheduling');
      AutoScheduleApp.mount(document.getElementById('pageContent'));
    });
  </script>
</body>
</html>
